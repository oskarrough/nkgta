<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>NK GTA · Gegend wählen</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				font-family: system-ui, sans-serif;
			}
			#map {
				position: fixed;
				inset: 0;
			}
			#map.drawing {
				cursor: crosshair;
			}
			.bar {
				position: fixed;
				z-index: 1000;
				top: 1rem;
				left: 50%;
				transform: translateX(-50%);
				display: flex;
				gap: 0.5rem;
				align-items: center;
				background: #222;
				color: #fff;
				padding: 0.5rem 0.75rem;
				border-radius: 0.5rem;
				box-shadow: 0 2px 10px #0006;
			}
			button {
				font: inherit;
				font-weight: 700;
				padding: 0.4rem 0.9rem;
				border: 0;
				border-radius: 0.3rem;
				cursor: pointer;
			}
			#play {
				background: #9be86a;
			}
			#play:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}
			#size.too-big {
				color: #ff8a7a;
			}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<div class="bar">
			<button id="draw">Neu zeichnen</button>
			<span id="size"></span>
			<button id="play">Spielen</button>
		</div>
		<script type="module" src="/src/pick.js"></script>
	</body>
</html>
