<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#222" />
		<title>NK GTA</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				overscroll-behavior: none;
				background: #222;
				font-family: system-ui, sans-serif;
				color: #fff;
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
				-webkit-tap-highlight-color: transparent;
			}
			canvas {
				position: fixed;
				inset: 0;
				display: block;
				width: 100vw;
				height: 100dvh;
				touch-action: none;
			}
			.hud {
				position: fixed;
				pointer-events: none;
				text-shadow:
					0 2px 0 #000,
					0 0 6px #000;
				font-weight: 800;
			}
			#street {
				top: calc(1rem + env(safe-area-inset-top));
				left: 0;
				right: 0;
				text-align: center;
				font-size: 2rem;
				text-transform: uppercase;
				letter-spacing: 0.05em;
			}
			#money {
				top: calc(1rem + env(safe-area-inset-top));
				right: calc(1.5rem + env(safe-area-inset-right));
				font-size: 2rem;
				color: #9be86a;
			}
			#bag {
				top: calc(3.5rem + env(safe-area-inset-top));
				right: calc(1.5rem + env(safe-area-inset-right));
				font-size: 1.4rem;
			}
			#bag:not(:empty)::before {
				content: '';
				display: inline-block;
				width: 1.1em;
				height: 1.1em;
				margin-right: 0.15em;
				background: var(--bottle) center / contain no-repeat;
				vertical-align: -0.15em;
			}
			#sound {
				position: fixed;
				top: calc(6rem + env(safe-area-inset-top));
				right: calc(1.25rem + env(safe-area-inset-right));
				z-index: 11;
				display: flex;
				flex-direction: row-reverse;
				align-items: center;
				gap: 0.4rem;
				touch-action: none;
			}
			#sound button,
			#menu-button {
				width: 2.6rem;
				height: 2.6rem;
				padding: 0;
				border: 2px solid rgba(255, 255, 255, 0.4);
				border-radius: 50%;
				background: rgba(0, 0, 0, 0.35);
				color: #fff;
				font-size: 1.2rem;
				cursor: pointer;
			}
			/* Icons are 32x32 PNGs in public/icons, painted pixel by pixel. */
			.icon {
				display: block;
				width: 32px;
				height: 32px;
				margin: auto;
				image-rendering: pixelated;
				pointer-events: none;
			}
			#menu-button {
				display: none;
				position: fixed;
				top: calc(1rem + env(safe-area-inset-top));
				left: calc(1rem + env(safe-area-inset-left));
				z-index: 11;
			}
			body.touch #menu-button {
				display: block;
			}
			/* Esc or the menu button: a grid of pictures, lit when on. ` opens the
			   debug menu, the same kind of panel. */
			.panel {
				position: fixed;
				z-index: 12;
				width: fit-content;
				height: fit-content;
				margin: 0;
				padding: 0.75rem;
				border: 2px solid rgba(255, 255, 255, 0.4);
				border-radius: 1.3rem;
				background: rgba(0, 0, 0, 0.6);
			}
			.panel[hidden] {
				display: none;
			}
			.panel menu {
				display: grid;
				grid-template-columns: repeat(4, auto);
				gap: 0.6rem;
				margin: 0;
				padding: 0;
				list-style: none;
			}
			#menu {
				inset: 0;
				margin: auto;
			}
			#debug {
				top: 1rem;
				left: 1rem;
			}
			.panel button[data-action] {
				position: relative;
				width: 4.6rem;
				min-height: 4.6rem;
				padding: 0.2rem 0.2rem 0.3rem;
				border: 2px solid rgba(255, 255, 255, 0.4);
				border-radius: 1.2rem;
				background: rgba(0, 0, 0, 0.35);
				cursor: pointer;
			}
			.panel button[data-action].on {
				background: rgba(232, 194, 26, 0.45);
				border-color: rgba(232, 194, 26, 0.9);
			}
			.panel button.off img {
				opacity: 0.4;
			}
			.panel button:focus-visible {
				outline: 2px solid #e8c21a;
			}
			.panel .icon {
				width: 64px;
				height: 64px;
			}
			.panel button span {
				display: block;
				color: #fff;
				font:
					700 0.65rem / 1.2 system-ui,
					sans-serif;
				hyphens: manual;
			}
			.panel kbd {
				position: absolute;
				right: 0.2rem;
				top: 0.2rem;
				padding: 0 0.25em;
				border-radius: 0.25em;
				background: #e7e7e5;
				box-shadow: 0 2px 0 #9a9a98;
				color: #1a1e1b;
				font:
					800 0.6rem / 1.3 system-ui,
					sans-serif;
			}
			body.touch .panel kbd {
				display: none;
			}
			/* What E does here: the key and a picture of it. */
			#use {
				bottom: calc(5rem + env(safe-area-inset-bottom));
				left: 0;
				right: 0;
				display: flex;
				justify-content: center;
				gap: 0.4rem;
			}
			#use[hidden],
			body.touch #use {
				display: none;
			}
			#use .icon {
				margin: 0;
				width: 64px;
				height: 64px;
				filter: drop-shadow(0 2px 0 #000);
			}
			#touch-use .icon {
				width: 64px;
				height: 64px;
			}
			#mute.on {
				background: rgba(232, 194, 26, 0.45);
				border-color: rgba(232, 194, 26, 0.9);
			}
			#volume {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				padding: 0 0.9rem 0 0.2rem;
				height: 2.6rem;
				border: 2px solid rgba(255, 255, 255, 0.4);
				border-radius: 1.3rem;
				background: rgba(0, 0, 0, 0.35);
				box-sizing: border-box;
			}
			#volume[hidden] {
				display: none;
			}
			#volume button {
				flex: none;
				width: 2.2rem;
				height: 2.2rem;
				border: 0;
				background: none;
				font-size: 1rem;
			}
			#volume input {
				appearance: none;
				-webkit-appearance: none;
				width: 8.5rem;
				height: 2.2rem;
				margin: 0;
				background: none;
				cursor: pointer;
				touch-action: none;
			}
			#volume input::-webkit-slider-runnable-track {
				height: 0.45rem;
				border-radius: 0.25rem;
				background: linear-gradient(to right, #e8c21a var(--level, 100%), rgba(255, 255, 255, 0.35) var(--level, 100%));
			}
			#volume input::-moz-range-track {
				height: 0.45rem;
				border-radius: 0.25rem;
				background: linear-gradient(to right, #e8c21a var(--level, 100%), rgba(255, 255, 255, 0.35) var(--level, 100%));
			}
			#volume input::-webkit-slider-thumb {
				-webkit-appearance: none;
				width: 1.4rem;
				height: 1.4rem;
				margin-top: -0.48rem;
				border: 2px solid #fff;
				border-radius: 50%;
				background: #e8c21a;
				box-shadow: 0 2px 0 #000;
			}
			#volume input::-moz-range-thumb {
				width: 1.2rem;
				height: 1.2rem;
				border: 2px solid #fff;
				border-radius: 50%;
				background: #e8c21a;
				box-shadow: 0 2px 0 #000;
			}
			#place {
				bottom: calc(2.5rem + env(safe-area-inset-bottom));
				left: 0;
				right: 0;
				text-align: center;
				font-size: 1.5rem;
			}
			#place.dot::before {
				content: '';
				display: inline-block;
				width: 0.7em;
				height: 0.7em;
				margin-right: 0.45em;
				border: 0.14em solid #1a1e1b;
				border-radius: 50%;
				background: var(--dot);
				vertical-align: -0.04em;
			}
			#wasted {
				top: 40%;
				left: 0;
				right: 0;
				text-align: center;
				font-size: 5rem;
				letter-spacing: 0.1em;
				color: #e23b2e;
			}
			#loading {
				top: 45%;
				left: 0;
				right: 0;
				text-align: center;
				font-size: 1.5rem;
			}

			/* Touch controls. Hidden until a coarse pointer or a real touch. */
			#touch {
				display: none;
				position: fixed;
				inset: 0;
				z-index: 10;
				pointer-events: none;
				touch-action: none;
			}
			body.touch #touch {
				display: block;
			}
			body.touch #place {
				bottom: calc(8.5rem + env(safe-area-inset-bottom));
			}
			#stick {
				position: absolute;
				width: 120px;
				height: 120px;
				margin: -60px 0 0 -60px;
				border-radius: 50%;
				border: 2px solid rgba(231, 231, 229, 0.4);
				background: rgba(26, 30, 27, 0.35);
				opacity: 0;
				pointer-events: none;
			}
			#stick.on {
				opacity: 1;
			}
			#stick-knob {
				position: absolute;
				left: 50%;
				top: 50%;
				width: 52px;
				height: 52px;
				margin: -26px 0 0 -26px;
				border-radius: 50%;
				background: rgba(232, 194, 26, 0.55);
				border: 2px solid rgba(231, 231, 229, 0.6);
			}
			#touch-actions {
				position: absolute;
				right: calc(1rem + env(safe-area-inset-right));
				bottom: calc(1rem + env(safe-area-inset-bottom));
				display: flex;
				align-items: flex-end;
				gap: 0.75rem;
				pointer-events: none;
			}
			.touch-button {
				pointer-events: auto;
				appearance: none;
				-webkit-appearance: none;
				display: flex;
				align-items: center;
				justify-content: center;
				width: 84px;
				height: 84px;
				padding: 0 0.4rem;
				border-radius: 50%;
				border: 2px solid rgba(231, 231, 229, 0.5);
				background: rgba(26, 30, 27, 0.55);
				color: #e7e7e5;
				font:
					800 0.72rem / 1.05 system-ui,
					sans-serif;
				text-transform: uppercase;
				text-align: center;
				letter-spacing: 0.04em;
				text-shadow: 0 2px 0 #000;
				touch-action: none;
				-webkit-tap-highlight-color: transparent;
				-webkit-touch-callout: none;
			}
			.touch-button.on {
				background: rgba(232, 194, 26, 0.45);
				border-color: rgba(232, 194, 26, 0.9);
			}
			.touch-button.dim {
				opacity: 0.4;
			}
			#touch-use {
				width: 92px;
				height: 92px;
				background: rgba(232, 194, 26, 0.22);
				border-color: rgba(232, 194, 26, 0.65);
			}
			#touch-boost {
				font-size: 0.62rem;
			}

			/* Narrow screens: the street name and the money share the top line. */
			@media (max-width: 600px) {
				#street {
					left: calc(1rem + env(safe-area-inset-left));
					right: auto;
					text-align: left;
					font-size: 1.35rem;
					letter-spacing: 0.03em;
				}
				#money {
					font-size: 1.6rem;
				}
				#bag {
					top: calc(3rem + env(safe-area-inset-top));
					font-size: 1.2rem;
				}
			}
		</style>
	</head>
	<body>
		<canvas id="city"></canvas>
		<canvas id="overlay"></canvas>
		<div class="hud" id="loading">Lade Karte…</div>
		<div class="hud" id="street"></div>
		<div class="hud" id="money"></div>
		<div class="hud" id="bag"></div>
		<div class="hud" id="place"></div>
		<div class="hud" id="use" hidden><img class="icon" src="/icons/key-e.png" alt="E" /><img class="icon" id="use-act" alt="" /></div>
		<div class="hud" id="wasted"></div>
		<div id="sound">
			<button id="mute" type="button" aria-label="Lautstärke" aria-expanded="false" aria-controls="volume" title="Lautstärke (L: Ton aus)">
				<img class="icon" src="/icons/speaker.png" alt="" />
			</button>
			<div id="volume" hidden>
				<button id="volume-mute" type="button" aria-label="Ton aus" title="Ton aus (L)">
					<img class="icon" src="/icons/speaker-off.png" alt="" />
				</button>
				<input id="volume-slider" type="range" min="0" max="100" step="1" aria-label="Lautstärke" />
			</div>
		</div>
		<button id="menu-button" type="button" aria-label="Menü" aria-expanded="false" aria-controls="menu" title="Menü (Esc)">
			<img class="icon" src="/icons/menu.png" alt="" />
		</button>
		<div id="menu" class="panel" hidden>
			<menu aria-label="Menü">
				<li>
					<button type="button" data-action="streets" aria-label="Straßennamen" title="Straßennamen (N)">
						<img class="icon" src="/icons/menu-streets.png" alt="" /><span>Straßen</span><kbd>N</kbd>
					</button>
				</li>
				<li>
					<button type="button" data-action="transit" aria-label="Haltestellen" title="Haltestellen (T)">
						<img class="icon" src="/icons/menu-stops.png" alt="" /><span>Halte&shy;stellen</span><kbd>T</kbd>
					</button>
				</li>
				<li>
					<button type="button" data-action="walls" aria-label="Wände" title="Wände (K)">
						<img class="icon" src="/icons/menu-walls.png" alt="" /><span>Wände</span><kbd>K</kbd>
					</button>
				</li>
				<li>
					<button type="button" data-action="look" aria-label="Look" title="Look (P)">
						<img class="icon" src="/icons/menu-look.png" alt="" /><span>Look</span><kbd>P</kbd>
					</button>
				</li>
				<li>
					<button type="button" data-action="camera" aria-label="Kamera" title="Kamera (V)">
						<img class="icon" src="/icons/menu-camera.png" alt="" /><span>Kamera</span><kbd>V</kbd>
					</button>
				</li>
				<li>
					<button type="button" data-action="sound" aria-label="Ton" title="Ton (L)">
						<img class="icon" src="/icons/speaker.png" alt="" /><span>Ton</span><kbd>L</kbd>
					</button>
				</li>
				<li>
					<button type="button" data-action="area" aria-label="Gegend wählen" title="Gegend wählen (M)">
						<img class="icon" src="/icons/menu-area.png" alt="" /><span>Gegend</span><kbd>M</kbd>
					</button>
				</li>
			</menu>
		</div>
		<div id="debug" class="panel" hidden>
			<menu aria-label="Debug">
				<li>
					<button type="button" data-action="music" aria-label="Musik-Debug" title="Musik-Debug (J)">
						<img class="icon" src="/icons/menu-music.png" alt="" /><span>Musik</span><kbd>J</kbd>
					</button>
				</li>
			</menu>
			<form id="tune"></form>
		</div>
		<div id="touch" aria-hidden="true">
			<div id="stick"><div id="stick-knob"></div></div>
			<div id="touch-actions">
				<button class="touch-button" id="touch-boost" type="button" aria-label="Turbo oder Handbremse">Turbo</button>
				<button class="touch-button dim" id="touch-use" type="button" aria-label="Benutzen"></button>
			</div>
		</div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
