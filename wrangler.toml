#:schema node_modules/wrangler/config-schema.json
name = "nkgta"
main = "worker/street.js"
compatibility_date = "2026-10-10"

[[routes]]
pattern = "nkgta.0sk.ar"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/street"]

[[durable_objects.bindings]]
name = "STREET"
class_name = "Street"

[[migrations]]
tag = "street"
new_sqlite_classes = ["Street"]
